<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Gedanke Lesen — Gedankengang</title>
	<link rel="stylesheet" href="style.css" />
	<script src="api.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js" defer></script>
	<script src="read.js" defer></script>
</head>
<body>

	<header class="header">
		<div class="container header-inner">
			<div class="logo">Gedankengang</div>
			<a href="index.html" class="back-link">← Zur Liste</a>
		</div>
	</header>

	<main class="container">
		<div class="nav-back-container">
			<a href="index.html" class="back-link">← Alle Essays</a>
		</div>

		<div class="article-box">
			<article>
				<div class="article-header">
					<h1 class="article-title" id="articleTitle">Lade Essay...</h1>
					
					<!-- Metadaten Matrix -->
					<table class="metadata-table">
						<tr>
							<td class="lbl">Veröffentlicht</td>
							<td id="metaDate">-</td>
							<td class="lbl">Lesezeit</td>
							<td id="metaReadTime">-</td>
						</tr>
						<tr>
							<td class="lbl">Themen</td>
							<td id="metaTags" colspan="3">-</td>
						</tr>
					</table>
				</div>

				<div class="article-body" id="articleBody">
					<!-- Dynamisch geladen -->
				</div>
			</article>

			<!-- Footer -->
			<footer class="footer">
				<div class="container footer-inner">
					<span>© Gedankengang Journal</span>
					<span>Lese-Modus</span>
				</div>
			</footer>
		</div>
	</main>
</body>
</html>
