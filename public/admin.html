<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Admin-Konsole — Gedankengang</title>
	<link rel="stylesheet" href="style.css" />
	<script src="api.js" defer></script>
	<script src="admin.js" defer></script>
</head>
<body>

	<header class="header">
		<div class="container header-inner">
			<div class="logo">Gedankengang <span class="logo-admin">Admin</span></div>
			<div>
				<a href="index.html" class="btn-top">Vorschau-Modus</a>
				<button id="logoutBtn" class="btn-top btn-logout-header" style="display:none;">Abmelden</button>
			</div>
		</div>
	</header>

	<main class="container">
		<!-- Screen 1: Login Form -->
		<section id="loginScreen" class="login-box">
			<h2 class="login-title">Admin-Anmeldung</h2>
			<div class="form-group">
				<label for="passwordInput">Passwort-Key</label>
				<input type="password" id="passwordInput" class="input-field" placeholder="Bitte Admin-Passwort eingeben" />
				<div id="loginError" style="display:none; color: var(--danger); font-family: var(--font-mono); font-size: 11.5px; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500;">Falsches Passwort! Bitte nutzen Sie "admin".</div>
			</div>
			<button class="btn">Freigeben</button>
		</section>

		<!-- Screen 2: Dashboard -->
		<section id="adminDashboard" class="admin-dashboard">
			<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px;">
				<div>
					<h1 class="h1" style="font-family: var(--font-display); font-size: 28px; font-weight: normal; margin: 0; letter-spacing: -0.015em;">Redaktionsbereich</h1>
					<p class="subtitle">Einträge verwalten, löschen oder neue Gedanken formulieren.</p>
				</div>
			</div>

			<div class="admin-layout">
				<!-- Col 1: Form -->
				<div>
					<h3 class="panel-title">Gedanke verfassen</h3>
					<form class="admin-form" id="essayForm">
						<div class="form-group">
							<label for="essayTitle">Essay-Titel</label>
							<input type="text" id="essayTitle" class="input-field" required placeholder="z.B. Die Poesie des Minimalismus" />
						</div>
						<div class="form-group">
							<label for="essayTags">Themen-Tags (Komma-getrennt)</label>
							<input type="text" id="essayTags" class="input-field" required placeholder="z.B. Philosophie, Geist, Ästhetik" />
						</div>
						<div class="form-group">
							<label for="essayReadTime">Lesezeit-Attribut</label>
							<input type="text" id="essayReadTime" class="input-field" required placeholder="z.B. 5 Min" />
						</div>
						<div class="form-group">
							<label for="essayContent">Inhalt (Markdown / Text)</label>
							<textarea id="essayContent" class="textarea-field" required placeholder="Schreiben Sie hier Ihre Gedanken nieder..."></textarea>
						</div>
						<button type="submit" class="btn">Gedanke veröffentlichen</button>
					</form>
				</div>

				<!-- Col 2: List -->
				<div>
					<h3 class="panel-title">Veröffentlichte Essays</h3>
					
					<div class="admin-essay-list" id="adminEssayList">
						<!-- Dynamisch geladen -->
					</div>
				</div>
			</div>
		</section>

		<!-- Footer -->
		<footer class="footer">
			<div class="container footer-inner">
				<span>© Gedankengang Journal</span>
				<span>Redaktionsbereich</span>
			</div>
		</footer>
	</main>
</body>
</html>
